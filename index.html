                                                                                                                                            ambientTint.addColorStop(1, isNight ? `rgba(40, 90, 150, ${waveEnergy * 0.05})` : `rgba(120, 210, 235, ${waveEnergy * 0.07})`);
                                                                                                                                            ctx.fillStyle = ambientTint;
                                                                                                                                            ctx.fillRect(0, W_HEIGHT * 0.45, W_WIDTH, W_HEIGHT * 0.55);
                                                                                                                                        }

                                                                    // 5. Foam / whitecaps on high-velocity nodes
                                                                    ctx.lineCap = 'round';
                                                                                        for (let i = 0; i < NODE_COUNT; i++) {
                                                                                            if (nodes[i].foam > 0.05) {
                                                                                                const foamAlpha = Math.min(nodes[i].foam, 0.9);
                                                                                                const splashHeight = nodes[i].foam * 8;
                                                                                                const spread = dx * 0.7;
                            
                                                                                                // 5. Smooth foam ribbon: short curved segment that follows the water surface (no straight sticks)
                                                                                                                                                                                                const prevI = Math.max(0, i - 1);
                                                                                                                                                                                                const nextI = Math.min(NODE_COUNT - 1, i + 1);
                                                                                                                                                                                                const foamLift = splashHeight * 0.15;
                                                                                                                                                                                                ctx.strokeStyle = isNight ? `rgba(205, 230, 255, ${foamAlpha * 0.4})` : `rgba(255, 255, 255, ${foamAlpha * 0.5})`;
                                                                                                                                                                                                ctx.lineWidth = 1.2 + nodes[i].foam * 1.2;
                                                                                                                                                                                                ctx.beginPath();
                                                                                                                                                                                                ctx.moveTo((i * dx + prevI * dx) / 2, (nodes[i].y + nodes[prevI].y) / 2 - foamLift);
                                                                                                                                                                                                ctx.quadraticCurveTo(i * dx, nodes[i].y - foamLift, (i * dx + nextI * dx) / 2, (nodes[i].y + nodes[nextI].y) / 2 - foamLift);
                                                                                                                                                                                                ctx.stroke();

                                                                                                                                                                                                // Trailing foam streak behind the crest (soft curve just under the surface)
                                                                                                                                                                                                                                                                                                ctx.strokeStyle = isNight ? `rgba(205, 230, 255, ${foamAlpha * 0.2})` : `rgba(255, 255, 255, ${foamAlpha * 0.25})`;
                                                                                                                                                                                                                                                                                                ctx.lineWidth = 0.8;
                                                                                                                                                                                                                                                                                                ctx.beginPath();
                                                                                                                                                                                                                                                                                                ctx.moveTo((i * dx + prevI * dx) / 2, (nodes[i].y + nodes[prevI].y) / 2 + 2 + nodes[i].foam * 2);
                                                                                                                                                                                                                                                                                                ctx.quadraticCurveTo(i * dx, nodes[i].y + 3 + nodes[i].foam * 2, (i * dx + nextI * dx) / 2, (nodes[i].y + nodes[nextI].y) / 2 + 3 + nodes[i].foam * 2);
                                                                                                                                                                                                                                                                                                ctx.stroke();

                                                                                                

                                                                                                                                                                                                // Spray streaks rising off the crest on hard impacts (no bubbles)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (nodes[i].foam > 0.5) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const sprayLen = nodes[i].foam * 5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const sprayLean = ((i % 3) - 1) * 1.5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.strokeStyle = isNight ? `rgba(215, 235, 255, ${foamAlpha * 0.22})` : `rgba(255, 255, 255, ${foamAlpha * 0.25})`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.lineWidth = 0.6;
                                                                                                                                                                                                                                                                                                    ctx.beginPath();
                                                                                                                                                                                                                                                                                                    ctx.moveTo(i * dx, nodes[i].y - splashHeight * 0.3);
                                                                                                                                                                                                                                                                                                    ctx.quadraticCurveTo(i * dx + sprayLean, nodes[i].y - splashHeight - sprayLen * 0.5, i * dx + sprayLean * 1.8, nodes[i].y - splashHeight - sprayLen);
                                                                                                                                                                                                                                                                                                    ctx.stroke();
                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                }

                                function loop() {
                                    updatePhysics();
                                    draw();
                                    requestAnimationFrame(loop);
                                }

                // --- Permissions Setup ---
                        startBtn.addEventListener('click', () => {
                            calibratingText.style.display = 'block';
                            startBtn.style.display = 'none';

                            const isIOS = /(iPod|iPhone|iPad)/i.test(navigator.userAgent);
            
                            const attachSensors = () => {
                                // Follow the exact binding pattern of working compass sites
                                if (!isIOS && 'ondeviceorientationabsolute' in window) {
                                    window.addEventListener('deviceorientationabsolute', onOrientationAbsolute, true);
                                } else {
                                    window.addEventListener('deviceorientation', onOrientation, true);
                                }
                                window.addEventListener('devicemotion', onMotion, true);
                            };

                            // iOS 13+ requires explicit permission request
                            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                                DeviceOrientationEvent.requestPermission()
                                    .then(permissionState => {
                                        if (permissionState === 'granted') attachSensors();
                                        else forceCalibration();
                                    })
                                    .catch(console.error);
                            } else {
                                // Android automatically provides access when bound
                                attachSensors();
                            }

                            // Failsafe: If no events arrive within 2 seconds, force dismiss
                            setTimeout(forceCalibration, 2000);
                        });

                        function forceCalibration() {
                            if (!calibrated) {
                                calibrated = true;
                                calibratingText.style.display = 'none';
                                permissionUI.style.display = 'none';
                            }
                        }

                        // Desktop Fallback (Drag or move mouse to test tilting)
        window.addEventListener('mousemove', (e) => {
            if (permissionUI.style.display !== 'none') permissionUI.style.display = 'none';
            calibrated = true;
            const normX = (e.clientX / window.innerWidth) - 0.5;
            targetTilt = normX * 0.8;
            targetHeading = normX * Math.PI;
        });

        // Desktop Click to trigger splash (surge from both edges plus a center impact for a natural wave collision)
                window.addEventListener('click', () => {
                    nodes[0].velocity += 20;
                    nodes[nodes.length - 1].velocity -= 20;
                    nodes[Math.floor(NODE_COUNT / 2)].velocity += (Math.random() - 0.5) * 14;
                });

        // Random rogue waves: a big swell rolls in every 5-6 seconds, with an occasional follow-up surge
                function triggerBigWave() {
                    const fromLeft = Math.random() < 0.5;
                    const power = 22 + Math.random() * 20;
                    const dir = fromLeft ? 1 : -1;
                    const start = fromLeft ? 0 : NODE_COUNT - 1;
                    for (let s = 0; s < 6; s++) {
                        const idx = start + dir * s;
                        if (idx >= 0 && idx < NODE_COUNT) {
                            nodes[idx].velocity += dir * -1 * power * (1 - s * 0.14);
                        }
                    }
                    nodes[Math.floor(NODE_COUNT / 2)].velocity += (Math.random() - 0.5) * power * 0.6;
                    // Sometimes a second (or third) wave follows close behind
                    if (Math.random() < 0.4) {
                        setTimeout(triggerBigWave, 700 + Math.random() * 900);
                    }
                }

                function scheduleBigWave() {
                    setTimeout(() => {
                        triggerBigWave();
                        scheduleBigWave();
                    }, 5000 + Math.random() * 1000);
                }
                scheduleBigWave();

                loop();

                // Watchdog: if the page never receives a single orientation or motion event,
        // say so plainly instead of leaving a blank/frozen debug panel
        setInterval(() => {
            if (orientationEventCount === 0 && motionEventCount === 0) {
                debugPanel.textContent = 'NO sensor events received at all.\nThis usually means the browser/OS is blocking motion sensors on this page,\nor this device does not expose deviceorientation/devicemotion.';
            }
        }, 3000);
    </script>
</body>
</html>
