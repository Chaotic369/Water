<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic Ocean & Compass Physics</title>
    <style>
        * {
                    box-sizing: border-box;
                    user-select: none;
                    -webkit-user-select: none;
                    -webkit-tap-highlight-color: transparent;
                }

        body {
                    margin: 0;
                    padding: 0;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    height: 100vh;
                    /* Cinematic out-of-focus horizon background */
                    background: linear-gradient(to bottom, #b4d0e7 0%, #d1e8ec 48%, #c5b5a2 52%, #856a52 100%);
                    font-family: system-ui, -apple-system, sans-serif;
                    overflow: hidden;
                }

        /* Rectangular Widget Container */
                        .widget-box {
                            position: relative;
                            width: 400px;
                            height: 260px;
                            border-radius: 24px;
                            overflow: hidden;
                            box-shadow: 
                                0 30px 60px -10px rgba(0, 0, 0, 0.8),
                                inset 0 0 20px rgba(255, 255, 255, 0.4),
                                inset 0 2px 10px rgba(255, 255, 255, 0.5);
                            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
                            backdrop-filter: blur(8px);
                            -webkit-backdrop-filter: blur(8px);
                            max-width: 90vw;
                            transform-origin: center;
                        }

                        .celestial-toggle {
                            position: absolute;
                            top: 12px;
                            left: 14px;
                            display: flex;
                            gap: 6px;
                            background: rgba(0, 0, 0, 0.35);
                            backdrop-filter: blur(6px);
                            -webkit-backdrop-filter: blur(6px);
                            padding: 3px 6px;
                            border-radius: 20px;
                            z-index: 10;
                            border: 1px solid rgba(255, 255, 255, 0.15);
                        }

                        .celestial-btn {
                            font-size: 13px;
                            cursor: pointer;
                            padding: 2px 6px;
                            border-radius: 12px;
                            opacity: 0.55;
                            transition: all 0.2s ease;
                            line-height: 1.2;
                        }

                        .celestial-btn.active {
                            opacity: 1;
                            background: rgba(255, 255, 255, 0.22);
                            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
                        }

                @media (max-width: 550px) {
                    .widget-box {
                        transform: scale(0.9);
                    }
                }

                canvas {
                    display: block;
                    width: 100%;
                    height: 100%;
                    border-radius: 24px;
                }

        /* Permission UI */
        #permission-ui {
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 24px;
        }

        #permission-ui h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        #permission-ui p {
            color: #a0aec0;
            font-size: 15px;
            line-height: 1.5;
            max-width: 280px;
            margin-bottom: 24px;
        }

        button {
                    padding: 14px 32px;
                    font-size: 16px;
                    font-weight: 600;
                    background: linear-gradient(135deg, #00b4db, #0083b0);
                    color: white;
                    border: none;
                    border-radius: 30px;
                    box-shadow: 0 8px 20px rgba(0, 180, 219, 0.35);
                    cursor: pointer;
                    transition: transform 0.15s ease;
                }

        button:active {
            transform: scale(0.96);
        }

        #calibrating-text {
            display: none;
            color: #00d4ff;
            font-size: 13px;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        /* Debug readout: shows raw sensor values on-screen so we can see what's arriving
           without needing DevTools */
        #debug-panel {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.5;
            padding: 8px 10px;
            border-radius: 8px;
            z-index: 200;
            white-space: pre-wrap;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="permission-ui">
        <h2>Ocean Horizon & Motion</h2>
        <p>Tilt and shake your device to experience physical fluid dynamics.</p>
        <button id="start-btn">Calibrate & Start</button>
        <div id="calibrating-text">Hold still… calibrating horizon</div>
    </div>

    <div class="widget-box">
            <div class="celestial-toggle" id="celestial-toggle">
                <span class="celestial-btn" id="sun-btn" title="Sun lighting">☀️</span>
                <span class="celestial-btn active" id="moon-btn" title="Moon lighting">🌙</span>
            </div>
            <canvas id="ocean-canvas"></canvas>
        </div>

    <div id="debug-panel">Waiting for sensor events…</div>

    <script>
        const canvas = document.getElementById('ocean-canvas');
                const ctx = canvas.getContext('2d');
                const permissionUI = document.getElementById('permission-ui');
                const startBtn = document.getElementById('start-btn');
                const calibratingText = document.getElementById('calibrating-text');
                        const debugPanel = document.getElementById('debug-panel');
                const sunBtn = document.getElementById('sun-btn');
                const moonBtn = document.getElementById('moon-btn');

                let isNight = true;
                const stars = [];
                for (let i = 0; i < 35; i++) {
                    stars.push({
                        x: Math.random() * 400,
                        y: Math.random() * 125,
                        r: Math.random() * 1.2 + 0.5,
                        twinkle: Math.random() * Math.PI * 2
                    });
                }

                function setLighting(night) {
                    isNight = night;
                    if (sunBtn && moonBtn) {
                        if (isNight) {
                            moonBtn.classList.add('active');
                            sunBtn.classList.remove('active');
                        } else {
                            sunBtn.classList.add('active');
                            moonBtn.classList.remove('active');
                        }
                    }
                    document.body.style.background = isNight
                        ? 'linear-gradient(to bottom, #0d1b2a 0%, #1b263b 48%, #415a77 52%, #1a2530 100%)'
                        : 'linear-gradient(to bottom, #b4d0e7 0%, #d1e8ec 48%, #c5b5a2 52%, #856a52 100%)';
                }

                if (sunBtn) {
                    sunBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        setLighting(false);
                    });
                }
                if (moonBtn) {
                    moonBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        setLighting(true);
                    });
                }
                canvas.addEventListener('click', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const clickX = (e.clientX - rect.left) * (W_WIDTH / rect.width);
                    const clickY = (e.clientY - rect.top) * (W_HEIGHT / rect.height);
                    if (clickX >= 270 && clickX <= 355 && clickY >= 15 && clickY <= 85) {
                        e.stopPropagation();
                        setLighting(!isNight);
                    }
                });
                setLighting(true);

                let lastOrientationEventTime = 0;
        let lastMotionEventTime = 0;
        let orientationEventCount = 0;
        let motionEventCount = 0;
        let usingAbsoluteGlobal = false;

        // High DPI Display Configuration
                        const W_WIDTH = 400;
                        const W_HEIGHT = 260;
                        const dpr = window.devicePixelRatio || 1;
                        canvas.width = W_WIDTH * dpr;
                        canvas.height = W_HEIGHT * dpr;
                        ctx.scale(dpr, dpr);

                        // --- Physics Engine & Waves ---
                        const NODE_COUNT = 40;
        const nodes = [];
        for (let i = 0; i < NODE_COUNT; i++) {
            nodes.push({
                y: 0,
                targetY: 0,
                velocity: 0,
                foam: 0 // Foam intensity for whitecap rendering
            });
        }

        const SPRING_K = 0.035;       // Water surface tension
        const DAMPING = 0.04;         // Wave decay speed
        const SPREAD = 0.22;          // Wave transmission across nodes
        const FOAM_VELOCITY_THRESHOLD = 2.2; // Velocity above which whitecaps form
        const FOAM_DECAY = 0.92;      // How fast foam fades per frame

        // State & Interpolation Targets
        let targetTilt = 0;           // Gravity roll target (radians)
        let currentTilt = 0;          // Smooth interpolated tilt
        let targetPitch = 0;          // Front/back tilt
        let currentPitch = 0;

        let targetHeading = 0;        // Compass direction (radians)
        let currentHeading = 0;

        // Calibration: the device's "neutral" resting beta angle, captured on Calibrate & Start
        let betaZero = 0.78;
        let calibrated = false;

        // Rolling buffer for shake detection so a real shake reads as sustained motion
        // rather than a single noisy frame
        const SHAKE_BUFFER_SIZE = 4;
        const shakeBuffer = new Array(SHAKE_BUFFER_SIZE).fill(0);
        let shakeBufferIdx = 0;
        let lastShake = { x: 0, y: 0, z: 0 };

        // Ship Object State
                        const ship = {
                            x: W_WIDTH / 2,
                            y: W_HEIGHT / 2,
                            rot: 0,
                            vy: 0,
                            sway: 0
                        };

        // Shortest-distance angle interpolation to prevent 360° spin flips
                function lerpAngle(current, target, factor) {
                    let diff = (target - current) % (Math.PI * 2);
                    if (diff < -Math.PI) diff += Math.PI * 2;
                    if (diff > Math.PI) diff -= Math.PI * 2;
                    return current + diff * factor;
                }

                // --- Sensor Event Listeners ---
                function processOrientation(e, isAbsolute) {
                    orientationEventCount++;
            
                    // Instantly dismiss the overlay as soon as we prove the sensor works
                    if (!calibrated) {
                        calibrated = true;
                        calibratingText.style.display = 'none';
                        permissionUI.style.display = 'none';
                    }

                    // Treat missing hardware sensors as 0 so the rest of the math doesn't explode
                    let rawGamma = e.gamma || 0;
                    let rawBeta = e.beta || 0;
                    let rawAlpha = e.alpha || 0;

                    let gamma = rawGamma * (Math.PI / 180);
                    let beta = rawBeta * (Math.PI / 180);

                    targetTilt = -Math.sin(gamma);
                    targetPitch = Math.max(-0.5, Math.min(0.5, (beta - 0.78) * 0.5));

                    // Compass calculation identical to typical online web-compasses
                    if (e.webkitCompassHeading !== undefined) {
                        targetHeading = (e.webkitCompassHeading * Math.PI) / 180;
                    } else {
                        targetHeading = (360 - rawAlpha) * (Math.PI / 180);
                    }

                    debugPanel.textContent = 
                        `Cmp: ${Math.round(targetHeading * 180 / Math.PI)}° | Tlt: ${Math.round(rawGamma)}° | Ptch: ${Math.round(rawBeta)}°\n` +
                        `Evts: ${orientationEventCount} | Abs: ${isAbsolute} | Mot: ${motionEventCount}`;
                }

                function onOrientationAbsolute(e) {
                    processOrientation(e, true);
                }

                function onOrientation(e) {
                    processOrientation(e, false);
                }

                function onMotion(e) {
                    motionEventCount++;
                    let acc = e.acceleration || e.accelerationIncludingGravity || { x: 0, y: 0, z: 0 };
                    const x = acc.x || 0; const y = acc.y || 0; const z = acc.z || 0;

                    const dx = x - lastShake.x;
                    const dy = y - lastShake.y;
                    const dz = z - lastShake.z;
                    lastShake = { x, y, z };

                    const jerk = Math.sqrt(dx * dx + dy * dy + dz * dz);
                    shakeBuffer[shakeBufferIdx] = jerk;
                    shakeBufferIdx = (shakeBufferIdx + 1) % SHAKE_BUFFER_SIZE;
                    const avgJerk = shakeBuffer.reduce((a, b) => a + b, 0) / SHAKE_BUFFER_SIZE;

                    if (avgJerk > 2.4) {
                        const splashForce = Math.min(avgJerk * 2.0, 55);
                        if (dx > 0) {
                            nodes[0].velocity += splashForce * 0.8;
                            nodes[nodes.length - 1].velocity -= splashForce * 0.8;
                        } else {
                            nodes[0].velocity -= splashForce * 0.8;
                            nodes[nodes.length - 1].velocity += splashForce * 0.8;
                        }
                        nodes[Math.floor(NODE_COUNT / 2)].velocity += (Math.random() - 0.5) * splashForce;
                        if (Math.abs(dz) > 1.5) {
                            for (let i = 0; i < NODE_COUNT; i++) {
                                nodes[i].velocity += (dz > 0 ? 1 : -1) * Math.min(Math.abs(dz) * 0.6, 8);
                            }
                        }
                    }
                }

                // --- Animation & Physics Loop ---
                                let clock = 0;

                                function updatePhysics() {
                                    clock += 0.04;

                                    const tiltDelta = Math.abs(targetTilt - currentTilt);
                                    const tiltSpeed = Math.min(0.08 + tiltDelta * 0.25, 0.35);
                                    currentTilt += (targetTilt - currentTilt) * tiltSpeed;

                                    const pitchDelta = Math.abs(targetPitch - currentPitch);
                                    const pitchSpeed = Math.min(0.08 + pitchDelta * 0.25, 0.35);
                                    currentPitch += (targetPitch - currentPitch) * pitchSpeed;

                                    currentHeading = lerpAngle(currentHeading, targetHeading, 0.07);

                                    const baselineCenter = (W_HEIGHT * 0.52) + (currentPitch * 40);
                                    const maxTiltDrop = (W_HEIGHT * 0.45) * currentTilt;

                                    for (let i = 0; i < NODE_COUNT; i++) {
                                        const ratio = (i / (NODE_COUNT - 1)) - 0.5;
                                        nodes[i].targetY = baselineCenter + (ratio * maxTiltDrop * 2);

                                        const diff = nodes[i].y - nodes[i].targetY;
                                        const force = -SPRING_K * diff - DAMPING * nodes[i].velocity;
                                        nodes[i].velocity += force;
                                        nodes[i].y += nodes[i].velocity;

                                        if (Math.abs(nodes[i].velocity) > FOAM_VELOCITY_THRESHOLD) {
                                            nodes[i].foam = Math.min(1, nodes[i].foam + (Math.abs(nodes[i].velocity) - FOAM_VELOCITY_THRESHOLD) * 0.15);
                                        } else {
                                            nodes[i].foam *= FOAM_DECAY;
                                        }
                                    }

                                    const leftPass = [];
                                    const rightPass = [];

                                    for (let i = 0; i < NODE_COUNT; i++) {
                                        if (i > 0) {
                                            leftPass[i] = SPREAD * (nodes[i].y - nodes[i - 1].y);
                                            nodes[i - 1].velocity += leftPass[i];
                                        }
                                        if (i < NODE_COUNT - 1) {
                                            rightPass[i] = SPREAD * (nodes[i].y - nodes[i + 1].y);
                                            nodes[i + 1].velocity += rightPass[i];
                                        }
                                    }

                                    // Ship horizontal motion (drifting with tilt and time)
                                                        ship.sway = Math.sin(clock * 0.6) * 20 + (currentTilt * 50);
                                                        ship.x = (W_WIDTH / 2) + ship.sway;
                    
                                                        if (ship.x < 50) ship.x = 50;
                                                        if (ship.x > W_WIDTH - 50) ship.x = W_WIDTH - 50;

                                                        const shipNode = Math.max(2, Math.min(NODE_COUNT - 3, Math.floor((ship.x / W_WIDTH) * NODE_COUNT)));
                                                        const waterHeightAtShip = nodes[shipNode].y;
                                                        const waterSlope = (nodes[shipNode + 1].y - nodes[shipNode - 1].y) / (2 * (W_WIDTH / NODE_COUNT));

                                                        // Add a bobbing motion to the Y axis
                                                        const bobbing = Math.sin(clock * 2.5) * 2;
                                                        ship.y += ((waterHeightAtShip + bobbing) - ship.y) * 0.15;
                    
                                                        const targetRot = Math.atan(waterSlope) + (currentTilt * 0.2); // Lean into the tilt
                                                                                                                ship.rot += (targetRot - ship.rot) * 0.12;
                                                                                        }

                                function draw() {
                                                                    ctx.clearRect(0, 0, W_WIDTH, W_HEIGHT);

                                                                    const dx = W_WIDTH / (NODE_COUNT - 1);
                                                                    const celestialX = 315;
                                                                    const celestialY = 48;

                                                                    // 0. Sky Backdrop & Celestial Body
                                                                    if (isNight) {
                                                                        const skyGrad = ctx.createLinearGradient(0, 0, 0, W_HEIGHT * 0.65);
                                                                        skyGrad.addColorStop(0, '#060d19');
                                                                        skyGrad.addColorStop(0.65, '#0c1d33');
                                                                        skyGrad.addColorStop(1, '#172d4a');
                                                                        ctx.fillStyle = skyGrad;
                                                                        ctx.fillRect(0, 0, W_WIDTH, W_HEIGHT);

                                                                        // Twinkling stars
                                                                        for (const s of stars) {
                                                                            const alpha = 0.35 + 0.45 * Math.sin(clock * 1.6 + s.twinkle);
                                                                            ctx.fillStyle = `rgba(225, 238, 255, ${alpha})`;
                                                                            ctx.beginPath();
                                                                            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                                                                            ctx.fill();
                                                                        }

                                                                        // Moon glow
                                                                        const moonGlow = ctx.createRadialGradient(celestialX, celestialY, 4, celestialX, celestialY, 32);
                                                                        moonGlow.addColorStop(0, 'rgba(215, 235, 255, 0.4)');
                                                                        moonGlow.addColorStop(0.5, 'rgba(150, 200, 255, 0.12)');
                                                                        moonGlow.addColorStop(1, 'rgba(150, 200, 255, 0)');
                                                                        ctx.fillStyle = moonGlow;
                                                                        ctx.beginPath();
                                                                        ctx.arc(celestialX, celestialY, 32, 0, Math.PI * 2);
                                                                        ctx.fill();

                                                                        // Small Moon Body
                                                                        const moonGrad = ctx.createRadialGradient(celestialX - 3, celestialY - 3, 2, celestialX, celestialY, 11);
                                                                        moonGrad.addColorStop(0, '#ffffff');
                                                                        moonGrad.addColorStop(0.7, '#e4eefa');
                                                                        moonGrad.addColorStop(1, '#b5cde6');
                                                                        ctx.fillStyle = moonGrad;
                                                                        ctx.beginPath();
                                                                        ctx.arc(celestialX, celestialY, 11, 0, Math.PI * 2);
                                                                        ctx.fill();

                                                                        // Subtle crater detail
                                                                        ctx.fillStyle = 'rgba(140, 170, 200, 0.35)';
                                                                        ctx.beginPath();
                                                                        ctx.arc(celestialX - 3, celestialY - 2, 2.3, 0, Math.PI * 2);
                                                                        ctx.arc(celestialX + 3, celestialY + 2, 2, 0, Math.PI * 2);
                                                                        ctx.arc(celestialX - 1, celestialY + 4, 1.5, 0, Math.PI * 2);
                                                                        ctx.fill();
                                                                    } else {
                                                                        const skyGrad = ctx.createLinearGradient(0, 0, 0, W_HEIGHT * 0.65);
                                                                        skyGrad.addColorStop(0, '#66a6db');
                                                                        skyGrad.addColorStop(0.65, '#a2cff0');
                                                                        skyGrad.addColorStop(1, '#d0e7f7');
                                                                        ctx.fillStyle = skyGrad;
                                                                        ctx.fillRect(0, 0, W_WIDTH, W_HEIGHT);

                                                                        // Sun glow
                                                                        const sunGlow = ctx.createRadialGradient(celestialX, celestialY, 6, celestialX, celestialY, 36);
                                                                        sunGlow.addColorStop(0, 'rgba(255, 240, 160, 0.55)');
                                                                        sunGlow.addColorStop(0.5, 'rgba(255, 200, 80, 0.18)');
                                                                        sunGlow.addColorStop(1, 'rgba(255, 180, 50, 0)');
                                                                        ctx.fillStyle = sunGlow;
                                                                        ctx.beginPath();
                                                                        ctx.arc(celestialX, celestialY, 36, 0, Math.PI * 2);
                                                                        ctx.fill();

                                                                        // Sun body
                                                                        const sunGrad = ctx.createRadialGradient(celestialX - 3, celestialY - 3, 2, celestialX, celestialY, 12);
                                                                        sunGrad.addColorStop(0, '#ffffff');
                                                                        sunGrad.addColorStop(0.55, '#fff0a6');
                                                                        sunGrad.addColorStop(1, '#ffbc3b');
                                                                        ctx.fillStyle = sunGrad;
                                                                        ctx.beginPath();
                                                                        ctx.arc(celestialX, celestialY, 12, 0, Math.PI * 2);
                                                                        ctx.fill();
                                                                    }

                                                                    // 1. Secondary Ambient Wave (Deeper layer for 3D fluid depth)
                                                                    ctx.beginPath();
                                                                    ctx.moveTo(0, W_HEIGHT);
                                                                    for (let i = 0; i < NODE_COUNT; i++) {
                                                                        const ambientWave = Math.sin(clock * 1.5 + i * 0.4) * 4;
                                                                        ctx.lineTo(i * dx, nodes[i].y + ambientWave - 4);
                                                                    }
                                                                    ctx.lineTo(W_WIDTH, W_HEIGHT);
                                                                    ctx.closePath();
                                                                    ctx.fillStyle = isNight ? 'rgba(8, 30, 55, 0.55)' : 'rgba(0, 110, 130, 0.45)';
                                                                    ctx.fill();

                                                                    // 2. The Ship (Black Pearl style Galleon silhouette)
                                                                    ctx.save();
                                                                    ctx.translate(ship.x, ship.y - 18);
                                                                    ctx.rotate(ship.rot);

                                                                    // Hull
                                                                    ctx.fillStyle = '#111111'; // Pitch dark wood
                                                                    ctx.beginPath();
                                                                    ctx.moveTo(-45, -5); // Stern high
                                                                    ctx.lineTo(-35, 12); // Stern bottom
                                                                    ctx.lineTo(35, 12);  // Bow bottom
                                                                    ctx.lineTo(55, -12); // Bowsprit tip
                                                                    ctx.lineTo(40, -5);  // Bow top
                                                                    ctx.lineTo(-45, -5); 
                                                                    ctx.fill();
                    
                                                                    // Hull trim detail
                                                                    ctx.strokeStyle = isNight ? '#5d4715' : '#8b6508';
                                                                    ctx.lineWidth = 1;
                                                                    ctx.beginPath();
                                                                    ctx.moveTo(-40, 0); ctx.lineTo(38, 0);
                                                                    ctx.stroke();

                                                                    // Masts
                                                                    ctx.strokeStyle = '#0f0f0f';
                                                                    ctx.lineWidth = 2.5;
                                                                    ctx.beginPath();
                                                                    ctx.moveTo(-25, -5); ctx.lineTo(-25, -55); // Mizzenmast
                                                                    ctx.moveTo(0, -5); ctx.lineTo(0, -75);   // Mainmast
                                                                    ctx.moveTo(25, -5); ctx.lineTo(25, -50);  // Foremast
                                                                    ctx.stroke();

                                                                    // Sails (Tattered, translucent grey with moonlit tint)
                                                                                        ctx.fillStyle = isNight ? 'rgba(175, 195, 215, 0.8)' : 'rgba(230, 240, 245, 0.85)';
                    
                                                                                        // Animate the sails billowing (wind effect)
                                                                                        const billow = Math.sin(clock * 1.5) * 6 + 18;
                                                                                        const backBillow = billow * 0.6;
                    
                                                                                        // Back (Mizzen) sails
                                                                                        ctx.beginPath();
                                                                                        ctx.moveTo(-25, -45); ctx.quadraticCurveTo(-25 + backBillow, -35, -25, -25);
                                                                                        ctx.moveTo(-25, -25); ctx.quadraticCurveTo(-25 + backBillow, -15, -25, -5);
                                                                                        ctx.fill();

                                                                                        // Main sails
                                                                                        ctx.beginPath();
                                                                                        ctx.moveTo(0, -65); ctx.quadraticCurveTo(0 + billow, -50, 0, -35);
                                                                                        ctx.moveTo(0, -35); ctx.quadraticCurveTo(0 + billow + 5, -20, 0, -5);
                                                                                        ctx.fill();

                                                                                        // Front (Foremast) sails
                                                                                        ctx.beginPath();
                                                                                        ctx.moveTo(25, -45); ctx.quadraticCurveTo(25 + billow * 0.8, -30, 25, -15);
                                                                                        ctx.moveTo(25, -15); ctx.quadraticCurveTo(25 + billow * 0.8, -5, 25, 0);
                                                                                        ctx.fill();

                                                                    // Pirate Flag (Jolly Roger silhouette)
                                                                    ctx.fillStyle = '#000';
                                                                    ctx.fillRect(-25, -55, -12, 6);

                                                                    ctx.restore();

                                                                    // 3. Primary Ocean Water Body (Front layer)
                                                                    ctx.beginPath();
                                                                    ctx.moveTo(0, W_HEIGHT);
                                                                    ctx.lineTo(0, nodes[0].y);

                                                                    // Bezier curve through nodes for liquid smoothness
                                                                    for (let i = 0; i < NODE_COUNT - 1; i++) {
                                                                        const cx = (i * dx + (i + 1) * dx) / 2;
                                                                        const cy = (nodes[i].y + nodes[i + 1].y) / 2;
                                                                        ctx.quadraticCurveTo(i * dx, nodes[i].y, cx, cy);
                                                                    }
                                                                    ctx.lineTo(W_WIDTH, nodes[NODE_COUNT - 1].y);
                                                                    ctx.lineTo(W_WIDTH, W_HEIGHT);
                                                                    ctx.closePath();

                                                                    const oceanGrad = ctx.createLinearGradient(0, W_HEIGHT * 0.3, 0, W_HEIGHT);
                                                                    if (isNight) {
                                                                        oceanGrad.addColorStop(0, 'rgba(16, 52, 90, 0.88)');
                                                                        oceanGrad.addColorStop(1, 'rgba(4, 16, 35, 0.98)');
                                                                    } else {
                                                                        oceanGrad.addColorStop(0, 'rgba(0, 160, 190, 0.8)');
                                                                        oceanGrad.addColorStop(1, 'rgba(0, 40, 80, 0.95)');
                                                                    }
                                                                    ctx.fillStyle = oceanGrad;
                                                                    ctx.fill();

                                                                    // Celestial light reflection shimmer
                                                                    const reflPrefix = isNight ? 'rgba(210, 235, 255, ' : 'rgba(255, 240, 180, ';
                                                                    for (let j = 0; j < 4; j++) {
                                                                        const ry = (W_HEIGHT * 0.58) + j * 16;
                                                                        const rw = 16 - j * 2;
                                                                        ctx.fillStyle = `${reflPrefix}${0.16 - j * 0.03})`;
                                                                        ctx.beginPath();
                                                                        ctx.ellipse(celestialX + Math.sin(clock * 2 + j) * 4, ry, rw, 2.2, 0, 0, Math.PI * 2);
                                                                        ctx.fill();
                                                                    }

                                                                    // 4. White Water Surface / Crest
                                                                    ctx.strokeStyle = isNight ? 'rgba(190, 225, 255, 0.55)' : 'rgba(255, 255, 255, 0.65)';
                                                                    ctx.lineWidth = 2;
                                                                    ctx.stroke();

                                                                    // 5. Foam / whitecaps on high-velocity nodes
                                                                    ctx.lineCap = 'round';
                                                                                        for (let i = 0; i < NODE_COUNT; i++) {
                                                                                            if (nodes[i].foam > 0.05) {
                                                                                                const foamAlpha = Math.min(nodes[i].foam, 0.9);
                                                                                                const splashHeight = nodes[i].foam * 8;
                                                                                                const spread = dx * 0.7;
                            
                                                                                                // 5. Stylized Foam / Whitecaps (Organic frothy crests instead of circles)
                                                                                                ctx.strokeStyle = isNight ? `rgba(205, 230, 255, ${foamAlpha * 0.85})` : `rgba(255, 255, 255, ${foamAlpha})`;
                                                                                                ctx.lineWidth = 2 + nodes[i].foam * 2.5;
                                                                                                ctx.beginPath();
                                                                                                ctx.moveTo(i * dx - spread, nodes[i].y - splashHeight * 0.15);
                                                                                                ctx.lineTo(i * dx + spread, nodes[i].y - splashHeight * 0.15);
                                                                                                ctx.stroke();

                                                                                                // Scattered droplets for high impacts (like tapping the screen)
                                                                                                if (nodes[i].foam > 0.3) {
                                                                                                    ctx.beginPath();
                                                                                                    const dropX = i * dx + ((i % 3) - 1) * 6;
                                                                                                    const dropY = nodes[i].y - splashHeight - 5;
                                                                                                    ctx.arc(dropX, dropY, nodes[i].foam * 1.8, 0, Math.PI * 2);
                                                                                                    ctx.fillStyle = isNight ? `rgba(215, 235, 255, ${foamAlpha * 0.75})` : `rgba(255, 255, 255, ${foamAlpha * 0.8})`;
                                                                                                    ctx.fill();
                                                                                                }
                                                                                            }
                                                                                        }
                                                                }

                                function loop() {
                                    updatePhysics();
                                    draw();
                                    requestAnimationFrame(loop);
                                }

                // --- Permissions Setup ---
                        startBtn.addEventListener('click', () => {
                            calibratingText.style.display = 'block';
                            startBtn.style.display = 'none';

                            const isIOS = /(iPod|iPhone|iPad)/i.test(navigator.userAgent);
            
                            const attachSensors = () => {
                                // Follow the exact binding pattern of working compass sites
                                if (!isIOS && 'ondeviceorientationabsolute' in window) {
                                    window.addEventListener('deviceorientationabsolute', onOrientationAbsolute, true);
                                } else {
                                    window.addEventListener('deviceorientation', onOrientation, true);
                                }
                                window.addEventListener('devicemotion', onMotion, true);
                            };

                            // iOS 13+ requires explicit permission request
                            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                                DeviceOrientationEvent.requestPermission()
                                    .then(permissionState => {
                                        if (permissionState === 'granted') attachSensors();
                                        else forceCalibration();
                                    })
                                    .catch(console.error);
                            } else {
                                // Android automatically provides access when bound
                                attachSensors();
                            }

                            // Failsafe: If no events arrive within 2 seconds, force dismiss
                            setTimeout(forceCalibration, 2000);
                        });

                        function forceCalibration() {
                            if (!calibrated) {
                                calibrated = true;
                                calibratingText.style.display = 'none';
                                permissionUI.style.display = 'none';
                            }
                        }

                        // Desktop Fallback (Drag or move mouse to test tilting)
        window.addEventListener('mousemove', (e) => {
            if (permissionUI.style.display !== 'none') permissionUI.style.display = 'none';
            calibrated = true;
            const normX = (e.clientX / window.innerWidth) - 0.5;
            targetTilt = normX * 0.8;
            targetHeading = normX * Math.PI;
        });

        // Desktop Click to trigger splash
        window.addEventListener('click', () => {
            nodes[0].velocity += 20;
            nodes[nodes.length - 1].velocity -= 20;
        });

        loop();

        // Watchdog: if the page never receives a single orientation or motion event,
        // say so plainly instead of leaving a blank/frozen debug panel
        setInterval(() => {
            if (orientationEventCount === 0 && motionEventCount === 0) {
                debugPanel.textContent = 'NO sensor events received at all.\nThis usually means the browser/OS is blocking motion sensors on this page,\nor this device does not expose deviceorientation/devicemotion.';
            }
        }, 3000);
    </script>
</body>
</html>
