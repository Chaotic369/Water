<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic Ocean & Compass Physics</title>
    <style>
        * {
                    box-sizing: border-box;
                    user-select: none;
                    -webkit-user-select: none;
                    -webkit-tap-highlight-color: transparent;
                }

        body {
                            margin: 0;
                            padding: 0;
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                            /* Cinematic out-of-focus horizon background */
                            background: linear-gradient(to bottom, #b4d0e7 0%, #d1e8ec 48%, #c5b5a2 52%, #856a52 100%);
                            font-family: system-ui, -apple-system, sans-serif;
                            overflow: hidden;
                            transition: background 0.4s ease, color 0.4s ease;
                        }

                body.night-mode {
                            background: linear-gradient(to bottom, #060c14 0%, #0d1b2a 48%, #132238 52%, #080e18 100%);
                        }

                body.night-mode .widget-box {
                            box-shadow: 
                                0 30px 60px -10px rgba(0, 0, 0, 0.95),
                                inset 0 0 25px rgba(100, 160, 240, 0.25),
                                inset 0 2px 10px rgba(160, 200, 255, 0.35);
                            background: linear-gradient(135deg, rgba(20, 35, 60, 0.35) 0%, rgba(10, 20, 35, 0.15) 100%);
                        }

                body.night-mode #debug-panel {
                            background: rgba(4, 9, 18, 0.88);
                            color: #4cd964;
                            border: 1px solid rgba(80, 140, 220, 0.25);
                        }

        /* Rectangular Widget Container */
                        .widget-box {
                            position: relative;
                            width: 400px;
                            height: 260px;
                            border-radius: 24px;
                            overflow: hidden;
                            box-shadow: 
                                0 30px 60px -10px rgba(0, 0, 0, 0.8),
                                inset 0 0 20px rgba(255, 255, 255, 0.4),
                                inset 0 2px 10px rgba(255, 255, 255, 0.5);
                            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
                            backdrop-filter: blur(8px);
                            -webkit-backdrop-filter: blur(8px);
                            max-width: 90vw;
                            transform-origin: center;
                        }

                        @media (max-width: 550px) {
                    .widget-box {
                        transform: scale(0.9);
                    }
                }

                canvas {
                    display: block;
                    width: 100%;
                    height: 100%;
                    border-radius: 24px;
                }

        /* Permission UI */
        #permission-ui {
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 24px;
        }

        #permission-ui h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        #permission-ui p {
            color: #a0aec0;
            font-size: 15px;
            line-height: 1.5;
            max-width: 280px;
            margin-bottom: 24px;
        }

        button {
                    padding: 14px 32px;
                    font-size: 16px;
                    font-weight: 600;
                    background: linear-gradient(135deg, #00b4db, #0083b0);
                    color: white;
                    border: none;
                    border-radius: 30px;
                    box-shadow: 0 8px 20px rgba(0, 180, 219, 0.35);
                    cursor: pointer;
                    transition: transform 0.15s ease;
                }

        button:active {
            transform: scale(0.96);
        }

        #calibrating-text {
            display: none;
            color: #00d4ff;
            font-size: 13px;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        /* Debug readout: shows raw sensor values on-screen so we can see what's arriving
           without needing DevTools */
        #debug-panel {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.5;
            padding: 8px 10px;
            border-radius: 8px;
            z-index: 200;
            white-space: pre-wrap;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="permission-ui">
        <h2>Ocean Horizon & Motion</h2>
        <p>Tilt and shake your device to experience physical fluid dynamics.</p>
        <button id="start-btn">Calibrate & Start</button>
        <div id="calibrating-text">Hold still… calibrating horizon</div>
    </div>

    <div class="widget-box">
                <canvas id="ocean-canvas"></canvas>
        </div>

    <div id="debug-panel">Waiting for sensor events…</div>

    <script>
        const canvas = document.getElementById('ocean-canvas');
                const ctx = canvas.getContext('2d');
                const permissionUI = document.getElementById('permission-ui');
                const startBtn = document.getElementById('start-btn');
                const calibratingText = document.getElementById('calibrating-text');
                        const debugPanel = document.getElementById('debug-panel');

                                        let isNight = true;
                                                        // Drifting clouds (shared by day and night; each is a cluster of soft puffs)
                                                        const clouds = [];
                                                        for (let i = 0; i < 6; i++) {
                                                            const puffs = [];
                                                            const puffCount = 4 + Math.floor(Math.random() * 3);
                                                            for (let p = 0; p < puffCount; p++) {
                                                                puffs.push({
                                                                    ox: (p - (puffCount - 1) / 2) * (9 + Math.random() * 4),
                                                                    oy: (Math.random() - 0.5) * 5,
                                                                    r: 8 + Math.random() * 7
                                                                });
                                                            }
                                                            clouds.push({
                                                                x: Math.random() * 480 - 40,
                                                                y: 18 + Math.random() * 62,
                                                                speed: 0.05 + Math.random() * 0.11,
                                                                scale: 0.7 + Math.random() * 0.7,
                                                                puffs: puffs
                                                            });
                                                        }
                                                        const stars = [];
                for (let i = 0; i < 35; i++) {
                    stars.push({
                        x: Math.random() * 400,
                        y: Math.random() * 125,
                        r: Math.random() * 1.2 + 0.5,
                        twinkle: Math.random() * Math.PI * 2
                    });
                }

                function setLighting(night) {
                            isNight = night;
                                                        if (isNight) {
                                document.body.classList.add('night-mode');
                            } else {
                                document.body.classList.remove('night-mode');
                            }
                        }

                // Tap the moon or sun in the sky to switch between night and day
                                canvas.addEventListener('click', (e) => {
                                    const rect = canvas.getBoundingClientRect();
                                    const clickX = (e.clientX - rect.left) * (W_WIDTH / rect.width);
                                    const clickY = (e.clientY - rect.top) * (W_HEIGHT / rect.height);
                                    const distX = clickX - 315;
                                    const distY = clickY - 48;
                                    if (distX * distX + distY * distY <= 30 * 30) {
                                        e.stopPropagation();
                                        setLighting(!isNight);
                                    }
                                });
                                setLighting(true);

                let lastOrientationEventTime = 0;
        let lastMotionEventTime = 0;
        let orientationEventCount = 0;
        let motionEventCount = 0;
        let usingAbsoluteGlobal = false;

        // High DPI Display Configuration
                        const W_WIDTH = 400;
                        const W_HEIGHT = 260;
                        const dpr = window.devicePixelRatio || 1;
                        canvas.width = W_WIDTH * dpr;
                        canvas.height = W_HEIGHT * dpr;
                        ctx.scale(dpr, dpr);

                        // --- Physics Engine & Waves ---
                        const NODE_COUNT = 40;
        const nodes = [];
        for (let i = 0; i < NODE_COUNT; i++) {
            nodes.push({
                y: 0,
                targetY: 0,
                velocity: 0,
                foam: 0 // Foam intensity for whitecap rendering
            });
        }

        const SPRING_K = 0.035;       // Water surface tension
        const DAMPING = 0.04;         // Wave decay speed
        const SPREAD = 0.22;          // Wave transmission across nodes
        const FOAM_VELOCITY_THRESHOLD = 2.2; // Velocity above which whitecaps form
        const FOAM_DECAY = 0.92;      // How fast foam fades per frame

        // State & Interpolation Targets
        let targetTilt = 0;           // Gravity roll target (radians)
        let currentTilt = 0;          // Smooth interpolated tilt
        let targetPitch = 0;          // Front/back tilt
        let currentPitch = 0;

        let targetHeading = 0;        // Compass direction (radians)
        let currentHeading = 0;

        // Calibration: the device's "neutral" resting beta angle, captured on Calibrate & Start
        let betaZero = 0.78;
        let calibrated = false;

        // Rolling buffer for shake detection so a real shake reads as sustained motion
        // rather than a single noisy frame
        const SHAKE_BUFFER_SIZE = 4;
        const shakeBuffer = new Array(SHAKE_BUFFER_SIZE).fill(0);
        let shakeBufferIdx = 0;
        let lastShake = { x: 0, y: 0, z: 0 };

        // Ship Object State
                        const ship = {
                            x: W_WIDTH / 2,
                            y: W_HEIGHT / 2,
                            rot: 0,
                            vy: 0,
                            sway: 0
                        };

        // Shortest-distance angle interpolation to prevent 360° spin flips
                function lerpAngle(current, target, factor) {
                    let diff = (target - current) % (Math.PI * 2);
                    if (diff < -Math.PI) diff += Math.PI * 2;
                    if (diff > Math.PI) diff -= Math.PI * 2;
                    return current + diff * factor;
                }

                // --- Sensor Event Listeners ---
                function processOrientation(e, isAbsolute) {
                    orientationEventCount++;
            
                    // Instantly dismiss the overlay as soon as we prove the sensor works
                    if (!calibrated) {
                        calibrated = true;
                        calibratingText.style.display = 'none';
                        permissionUI.style.display = 'none';
                    }

                    // Treat missing hardware sensors as 0 so the rest of the math doesn't explode
                    let rawGamma = e.gamma || 0;
                    let rawBeta = e.beta || 0;
                    let rawAlpha = e.alpha || 0;

                    let gamma = rawGamma * (Math.PI / 180);
                    let beta = rawBeta * (Math.PI / 180);

                    targetTilt = -Math.sin(gamma);
                    targetPitch = Math.max(-0.5, Math.min(0.5, (beta - 0.78) * 0.5));

                    // Compass calculation identical to typical online web-compasses
                    if (e.webkitCompassHeading !== undefined) {
                        targetHeading = (e.webkitCompassHeading * Math.PI) / 180;
                    } else {
                        targetHeading = (360 - rawAlpha) * (Math.PI / 180);
                    }

                    debugPanel.textContent = 
                        `Cmp: ${Math.round(targetHeading * 180 / Math.PI)}° | Tlt: ${Math.round(rawGamma)}° | Ptch: ${Math.round(rawBeta)}°\n` +
                        `Evts: ${orientationEventCount} | Abs: ${isAbsolute} | Mot: ${motionEventCount}`;
                }

                function onOrientationAbsolute(e) {
                    processOrientation(e, true);
                }

                function onOrientation(e) {
                    processOrientation(e, false);
                }

                function onMotion(e) {
                    motionEventCount++;
                    let acc = e.acceleration || e.accelerationIncludingGravity || { x: 0, y: 0, z: 0 };
                    const x = acc.x || 0; const y = acc.y || 0; const z = acc.z || 0;

                    const dx = x - lastShake.x;
                    const dy = y - lastShake.y;
                    const dz = z - lastShake.z;
                    lastShake = { x, y, z };

                    const jerk = Math.sqrt(dx * dx + dy * dy + dz * dz);
                    shakeBuffer[shakeBufferIdx] = jerk;
                    shakeBufferIdx = (shakeBufferIdx + 1) % SHAKE_BUFFER_SIZE;
                    const avgJerk = shakeBuffer.reduce((a, b) => a + b, 0) / SHAKE_BUFFER_SIZE;

                    if (avgJerk > 2.4) {
                        const splashForce = Math.min(avgJerk * 2.0, 55);
                        if (dx > 0) {
                            nodes[0].velocity += splashForce * 0.8;
                            nodes[nodes.length - 1].velocity -= splashForce * 0.8;
                        } else {
                            nodes[0].velocity -= splashForce * 0.8;
                            nodes[nodes.length - 1].velocity += splashForce * 0.8;
                        }
                        nodes[Math.floor(NODE_COUNT / 2)].velocity += (Math.random() - 0.5) * splashForce;
                        if (Math.abs(dz) > 1.5) {
                            for (let i = 0; i < NODE_COUNT; i++) {
                                nodes[i].velocity += (dz > 0 ? 1 : -1) * Math.min(Math.abs(dz) * 0.6, 8);
                            }
                        }
                    }
                }

                // --- Animation & Physics Loop ---
                                let clock = 0;

                                function updatePhysics() {
                                    clock += 0.04;

                                    const tiltDelta = Math.abs(targetTilt - currentTilt);
                                    const tiltSpeed = Math.min(0.08 + tiltDelta * 0.25, 0.35);
                                    currentTilt += (targetTilt - currentTilt) * tiltSpeed;

                                    const pitchDelta = Math.abs(targetPitch - currentPitch);
                                    const pitchSpeed = Math.min(0.08 + pitchDelta * 0.25, 0.35);
                                    currentPitch += (targetPitch - currentPitch) * pitchSpeed;

                                    currentHeading = lerpAngle(currentHeading, targetHeading, 0.07);

                                    const baselineCenter = (W_HEIGHT * 0.52) + (currentPitch * 40);
                                    const maxTiltDrop = (W_HEIGHT * 0.45) * currentTilt;

                                    for (let i = 0; i < NODE_COUNT; i++) {
                                        const ratio = (i / (NODE_COUNT - 1)) - 0.5;
                                        nodes[i].targetY = baselineCenter + (ratio * maxTiltDrop * 2);

                                        const diff = nodes[i].y - nodes[i].targetY;
                                        const force = -SPRING_K * diff - DAMPING * nodes[i].velocity;
                                        nodes[i].velocity += force;
                                        nodes[i].y += nodes[i].velocity;

                                        if (Math.abs(nodes[i].velocity) > FOAM_VELOCITY_THRESHOLD) {
                                            nodes[i].foam = Math.min(1, nodes[i].foam + (Math.abs(nodes[i].velocity) - FOAM_VELOCITY_THRESHOLD) * 0.15);
                                        } else {
                                            nodes[i].foam *= FOAM_DECAY;
                                        }
                                    }

                                    const leftPass = [];
                                    const rightPass = [];

                                    for (let i = 0; i < NODE_COUNT; i++) {
                                        if (i > 0) {
                                            leftPass[i] = SPREAD * (nodes[i].y - nodes[i - 1].y);
                                            nodes[i - 1].velocity += leftPass[i];
                                        }
                                        if (i < NODE_COUNT - 1) {
                                            rightPass[i] = SPREAD * (nodes[i].y - nodes[i + 1].y);
                                            nodes[i + 1].velocity += rightPass[i];
                                        }
                                    }

                                    // Surface smoothing: blend each node toward its neighbours so the water edge stays a clean curve
                                                                        for (let i = 1; i < NODE_COUNT - 1; i++) {
                                                                            const smoothed = (nodes[i - 1].y + nodes[i + 1].y) * 0.5;
                                                                            nodes[i].y += (smoothed - nodes[i].y) * 0.18;
                                                                        }

                                                                        // Ship horizontal motion (drifting with tilt and time)
                                                        ship.sway = Math.sin(clock * 0.6) * 20 + (currentTilt * 50);
                                                        ship.x = (W_WIDTH / 2) + ship.sway;
                    
                                                        if (ship.x < 50) ship.x = 50;
                                                        if (ship.x > W_WIDTH - 50) ship.x = W_WIDTH - 50;

                                                        const shipNode = Math.max(2, Math.min(NODE_COUNT - 3, Math.floor((ship.x / W_WIDTH) * NODE_COUNT)));
                                                        const waterHeightAtShip = nodes[shipNode].y;
                                                        const waterSlope = (nodes[shipNode + 1].y - nodes[shipNode - 1].y) / (2 * (W_WIDTH / NODE_COUNT));

                                                        // Add a bobbing motion to the Y axis
                                                        const bobbing = Math.sin(clock * 2.5) * 2;
                                                        ship.y += ((waterHeightAtShip + bobbing) - ship.y) * 0.15;
                    
                                                        const targetRot = Math.atan(waterSlope) + (currentTilt * 0.2); // Lean into the tilt
                                                                                                                ship.rot += (targetRot - ship.rot) * 0.12;
                                                                                        }

                                function draw() {
                                                                    ctx.clearRect(0, 0, W_WIDTH, W_HEIGHT);

                                                                    const dx = W_WIDTH / (NODE_COUNT - 1);
                                                                    const celestialX = 315;
                                                                    const celestialY = 48;

                                                                    // 0. Sky Backdrop & Celestial Body
                                                                    if (isNight) {
                                                                        const skyGrad = ctx.createLinearGradient(0, 0, 0, W_HEIGHT * 0.65);
                                                                        skyGrad.addColorStop(0, '#060d19');
                                                                        skyGrad.addColorStop(0.65, '#0c1d33');
                                                                        skyGrad.addColorStop(1, '#172d4a');
                                                                        ctx.fillStyle = skyGrad;
                                                                        ctx.fillRect(0, 0, W_WIDTH, W_HEIGHT);

                                                                        // Twinkling stars
                                                                        for (const s of stars) {
                                                                            const alpha = 0.35 + 0.45 * Math.sin(clock * 1.6 + s.twinkle);
                                                                            ctx.fillStyle = `rgba(225, 238, 255, ${alpha})`;
                                                                            ctx.beginPath();
                                                                            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                                                                            ctx.fill();
                                                                        }

                                                                        // Moon glow
                                                                        const moonGlow = ctx.createRadialGradient(celestialX, celestialY, 4, celestialX, celestialY, 32);
                                                                        moonGlow.addColorStop(0, 'rgba(215, 235, 255, 0.4)');
                                                                        moonGlow.addColorStop(0.5, 'rgba(150, 200, 255, 0.12)');
                                                                        moonGlow.addColorStop(1, 'rgba(150, 200, 255, 0)');
                                                                        ctx.fillStyle = moonGlow;
                                                                        ctx.beginPath();
                                                                        ctx.arc(celestialX, celestialY, 32, 0, Math.PI * 2);
                                                                        ctx.fill();

                                                                        // Small Moon Body
                                                                        const moonGrad = ctx.createRadialGradient(celestialX - 3, celestialY - 3, 2, celestialX, celestialY, 11);
                                                                        moonGrad.addColorStop(0, '#ffffff');
                                                                        moonGrad.addColorStop(0.7, '#e4eefa');
                                                                        moonGrad.addColorStop(1, '#b5cde6');
                                                                        ctx.fillStyle = moonGrad;
                                                                        ctx.beginPath();
                                                                        ctx.arc(celestialX, celestialY, 11, 0, Math.PI * 2);
                                                                        ctx.fill();

                                                                        // Subtle crater detail
                                                                        ctx.fillStyle = 'rgba(140, 170, 200, 0.35)';
                                                                        ctx.beginPath();
                                                                        ctx.arc(celestialX - 3, celestialY - 2, 2.3, 0, Math.PI * 2);
                                                                        ctx.arc(celestialX + 3, celestialY + 2, 2, 0, Math.PI * 2);
                                                                        ctx.arc(celestialX - 1, celestialY + 4, 1.5, 0, Math.PI * 2);
                                                                        ctx.fill();
                                                                    } else {
                                                                        const skyGrad = ctx.createLinearGradient(0, 0, 0, W_HEIGHT * 0.65);
                                                                        skyGrad.addColorStop(0, '#66a6db');
                                                                        skyGrad.addColorStop(0.65, '#a2cff0');
                                                                        skyGrad.addColorStop(1, '#d0e7f7');
                                                                        ctx.fillStyle = skyGrad;
                                                                        ctx.fillRect(0, 0, W_WIDTH, W_HEIGHT);

                                                                        // Sun glow
                                                                        const sunGlow = ctx.createRadialGradient(celestialX, celestialY, 6, celestialX, celestialY, 36);
                                                                        sunGlow.addColorStop(0, 'rgba(255, 240, 160, 0.55)');
                                                                        sunGlow.addColorStop(0.5, 'rgba(255, 200, 80, 0.18)');
                                                                        sunGlow.addColorStop(1, 'rgba(255, 180, 50, 0)');
                                                                        ctx.fillStyle = sunGlow;
                                                                        ctx.beginPath();
                                                                        ctx.arc(celestialX, celestialY, 36, 0, Math.PI * 2);
                                                                        ctx.fill();

                                                                        // Sun body
                                                                        const sunGrad = ctx.createRadialGradient(celestialX - 3, celestialY - 3, 2, celestialX, celestialY, 12);
                                                                        sunGrad.addColorStop(0, '#ffffff');
                                                                        sunGrad.addColorStop(0.55, '#fff0a6');
                                                                        sunGrad.addColorStop(1, '#ffbc3b');
                                                                        ctx.fillStyle = sunGrad;
                                                                        ctx.beginPath();
                                                                        ctx.arc(celestialX, celestialY, 12, 0, Math.PI * 2);
                                                                        ctx.fill();
                                                                    }

                                                                    // Clouds drifting across the sky (behind the ship and water)
                                                                                                                                        for (const c of clouds) {
                                                                                                                                            c.x += c.speed;
                                                                                                                                            if (c.x > W_WIDTH + 80) c.x = -80;
                                                                                                                                            for (const pf of c.puffs) {
                                                                                                                                                const px = c.x + pf.ox * c.scale;
                                                                                                                                                const py = c.y + pf.oy * c.scale;
                                                                                                                                                const pr = pf.r * c.scale;
                                                                                                                                                const cg = ctx.createRadialGradient(px - pr * 0.25, py - pr * 0.3, pr * 0.1, px, py, pr);
                                                                                                                                                if (isNight) {
                                                                                                                                                    cg.addColorStop(0, 'rgba(70, 92, 122, 0.5)');
                                                                                                                                                    cg.addColorStop(0.6, 'rgba(38, 56, 84, 0.34)');
                                                                                                                                                    cg.addColorStop(1, 'rgba(24, 40, 66, 0)');
                                                                                                                                                } else {
                                                                                                                                                    cg.addColorStop(0, 'rgba(255, 255, 255, 0.92)');
                                                                                                                                                    cg.addColorStop(0.6, 'rgba(238, 246, 252, 0.6)');
                                                                                                                                                    cg.addColorStop(1, 'rgba(215, 232, 245, 0)');
                                                                                                                                                }
                                                                                                                                                ctx.fillStyle = cg;
                                                                                                                                                ctx.beginPath();
                                                                                                                                                ctx.arc(px, py, pr, 0, Math.PI * 2);
                                                                                                                                                ctx.fill();
                                                                                                                                            }
                                                                                                                                        }

                                                                                                                                        // Horizon haze band (atmospheric perspective where sea meets sky)
                                                                                                                                        const hazeY = W_HEIGHT * 0.52 + currentPitch * 40;
                                                                                                                                        const hazeGrad = ctx.createLinearGradient(0, hazeY - 34, 0, hazeY + 10);
                                                                                                                                        hazeGrad.addColorStop(0, isNight ? 'rgba(40, 70, 110, 0)' : 'rgba(235, 245, 250, 0)');
                                                                                                                                        hazeGrad.addColorStop(0.7, isNight ? 'rgba(40, 70, 110, 0.35)' : 'rgba(235, 245, 250, 0.55)');
                                                                                                                                        hazeGrad.addColorStop(1, isNight ? 'rgba(30, 55, 90, 0.15)' : 'rgba(220, 235, 240, 0.2)');
                                                                                                                                        ctx.fillStyle = hazeGrad;
                                                                                                                                        ctx.fillRect(0, hazeY - 34, W_WIDTH, 44);

                                                                                                                                        // 1. Secondary Ambient Wave (Deeper layer for 3D fluid depth)
                                                                                                                                        ctx.beginPath();
                                                                                                                                        ctx.moveTo(0, W_HEIGHT);
                                                                                                                                        for (let i = 0; i < NODE_COUNT; i++) {
                                                                                                                                            const ambientWave = Math.sin(clock * 1.5 + i * 0.4) * 4 + Math.sin(clock * 0.9 + i * 0.85) * 2.2 + Math.sin(clock * 2.3 + i * 1.7) * 0.9;
                                                                                                                                            ctx.lineTo(i * dx, nodes[i].y + ambientWave - 4);
                                                                                                                                        }
                                                                                                                                        ctx.lineTo(W_WIDTH, W_HEIGHT);
                                                                                                                                        ctx.closePath();
                                                                                                                                        const farGrad = ctx.createLinearGradient(0, W_HEIGHT * 0.4, 0, W_HEIGHT);
                                                                                                                                        farGrad.addColorStop(0, isNight ? 'rgba(20, 55, 95, 0.6)' : 'rgba(40, 140, 165, 0.5)');
                                                                                                                                        farGrad.addColorStop(1, isNight ? 'rgba(6, 22, 42, 0.6)' : 'rgba(0, 80, 110, 0.5)');
                                                                                                                                        ctx.fillStyle = farGrad;
                                                                                                                                        ctx.fill();

                                                                    // Ship drop shadow / reflection on the water surface
                                                                                                                                        ctx.save();
                                                                                                                                        ctx.translate(ship.x, ship.y + 4);
                                                                                                                                        ctx.scale(1, 0.18);
                                                                                                                                        const shadowGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 55);
                                                                                                                                        shadowGrad.addColorStop(0, isNight ? 'rgba(0, 0, 0, 0.5)' : 'rgba(0, 20, 40, 0.42)');
                                                                                                                                        shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                                                                                                                                        ctx.fillStyle = shadowGrad;
                                                                                                                                        ctx.beginPath();
                                                                                                                                        ctx.arc(0, 0, 55, 0, Math.PI * 2);
                                                                                                                                        ctx.fill();
                                                                                                                                        ctx.restore();

                                                                                                                                        // 2. The Ship (Black Pearl style Galleon silhouette)
                                                                                                                                        ctx.save();
                                                                                                                                        ctx.translate(ship.x, ship.y - 18);
                                                                                                                                        ctx.rotate(ship.rot);

                                                                    // Hull
                                                                                                                                        const hullGrad = ctx.createLinearGradient(0, -12, 0, 12);
                                                                                                                                        hullGrad.addColorStop(0, isNight ? '#2a2119' : '#3b2c1d');
                                                                                                                                        hullGrad.addColorStop(0.45, '#161210');
                                                                                                                                        hullGrad.addColorStop(1, '#050505');
                                                                                                                                        ctx.fillStyle = hullGrad; // Weathered dark wood with depth shading
                                                                                                                                        ctx.beginPath();
                                                                                                                                        ctx.moveTo(-45, -5); // Stern high
                                                                                                                                        ctx.quadraticCurveTo(-42, 6, -35, 12); // Stern bottom (curved transom)
                                                                                                                                        ctx.quadraticCurveTo(0, 16, 35, 12);  // Keel curve to bow bottom
                                                                                                                                        ctx.quadraticCurveTo(48, 2, 55, -12); // Bowsprit tip
                                                                                                                                        ctx.lineTo(40, -5);  // Bow top
                                                                                                                                        ctx.lineTo(-45, -5); 
                                                                                                                                        ctx.fill();

                                                                                                                                        // Stern castle and quarterdeck
                                                                                                                                        ctx.fillStyle = isNight ? '#1d1712' : '#2b1f15';
                                                                                                                                        ctx.fillRect(-45, -13, 18, 8);
                                                                                                                                        ctx.fillStyle = isNight ? 'rgba(255, 190, 90, 0.85)' : 'rgba(255, 220, 140, 0.55)';
                                                                                                                                        ctx.fillRect(-42, -10, 3, 3);
                                                                                                                                        ctx.fillRect(-36, -10, 3, 3);

                                                                                                                                        // Cannon ports along the gun deck
                                                                                                                                        ctx.fillStyle = '#000';
                                                                                                                                        for (let p = 0; p < 6; p++) {
                                                                                                                                            ctx.fillRect(-30 + p * 11, 3, 4, 3);
                                                                                                                                        }

                                                                                                                                        // Waterline shadow under hull
                                                                                                                                        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                                                                                                                                        ctx.fillRect(-34, 10, 68, 2);
                    
                                                                    // Hull trim detail
                                                                    ctx.strokeStyle = isNight ? '#5d4715' : '#8b6508';
                                                                    ctx.lineWidth = 1;
                                                                    ctx.beginPath();
                                                                    ctx.moveTo(-40, 0); ctx.lineTo(38, 0);
                                                                    ctx.stroke();

                                                                    // Masts
                                                                                                                                        ctx.strokeStyle = '#1a140e';
                                                                                                                                        ctx.lineWidth = 2.5;
                                                                                                                                        ctx.beginPath();
                                                                                                                                        ctx.moveTo(-25, -5); ctx.lineTo(-25, -55); // Mizzenmast
                                                                                                                                        ctx.moveTo(0, -5); ctx.lineTo(0, -75);   // Mainmast
                                                                                                                                        ctx.moveTo(25, -5); ctx.lineTo(25, -50);  // Foremast
                                                                                                                                        ctx.stroke();

                                                                                                                                        // Yards (horizontal spars) and rigging lines
                                                                                                                                        ctx.lineWidth = 1.4;
                                                                                                                                        ctx.beginPath();
                                                                                                                                        ctx.moveTo(-33, -45); ctx.lineTo(-17, -45);
                                                                                                                                        ctx.moveTo(-33, -25); ctx.lineTo(-17, -25);
                                                                                                                                        ctx.moveTo(-11, -65); ctx.lineTo(11, -65);
                                                                                                                                        ctx.moveTo(-11, -35); ctx.lineTo(11, -35);
                                                                                                                                        ctx.moveTo(17, -45); ctx.lineTo(33, -45);
                                                                                                                                        ctx.moveTo(17, -15); ctx.lineTo(33, -15);
                                                                                                                                        ctx.stroke();

                                                                                                                                        ctx.strokeStyle = isNight ? 'rgba(120, 105, 85, 0.55)' : 'rgba(70, 55, 40, 0.65)';
                                                                                                                                        ctx.lineWidth = 0.6;
                                                                                                                                        ctx.beginPath();
                                                                                                                                        ctx.moveTo(0, -75); ctx.lineTo(-40, -5);
                                                                                                                                        ctx.moveTo(0, -75); ctx.lineTo(38, -6);
                                                                                                                                        ctx.moveTo(0, -75); ctx.lineTo(-25, -55);
                                                                                                                                        ctx.moveTo(0, -75); ctx.lineTo(25, -50);
                                                                                                                                        ctx.moveTo(25, -50); ctx.lineTo(54, -12);
                                                                                                                                        ctx.moveTo(-25, -55); ctx.lineTo(-44, -12);
                                                                                                                                        ctx.stroke();

                                                                    // Sails (Tattered, translucent grey with moonlit tint)
                                                                                        ctx.fillStyle = isNight ? 'rgba(175, 195, 215, 0.8)' : 'rgba(230, 240, 245, 0.85)';
                    
                                                                                        // Animate the sails billowing (wind effect)
                                                                                        const billow = Math.sin(clock * 1.5) * 6 + 18;
                                                                                        const backBillow = billow * 0.6;
                    
                                                                                        const sailShade = ctx.createLinearGradient(-30, 0, 45, 0);
                                                                                                                                                                                sailShade.addColorStop(0, isNight ? 'rgba(120, 140, 165, 0.82)' : 'rgba(205, 215, 220, 0.88)');
                                                                                                                                                                                sailShade.addColorStop(0.55, isNight ? 'rgba(190, 210, 232, 0.85)' : 'rgba(245, 248, 248, 0.9)');
                                                                                                                                                                                sailShade.addColorStop(1, isNight ? 'rgba(95, 115, 140, 0.8)' : 'rgba(190, 200, 205, 0.88)');
                                                                                                                                                                                ctx.fillStyle = sailShade;

                                                                                                                                                                                // Back (Mizzen) sails
                                                                                                                                                                                ctx.beginPath();
                                                                                                                                                                                ctx.moveTo(-25, -45); ctx.quadraticCurveTo(-25 + backBillow, -35, -25, -25);
                                                                                                                                                                                ctx.lineTo(-33, -25); ctx.lineTo(-33, -45); ctx.closePath();
                                                                                                                                                                                ctx.moveTo(-25, -25); ctx.quadraticCurveTo(-25 + backBillow, -15, -25, -5);
                                                                                                                                                                                ctx.lineTo(-33, -5); ctx.lineTo(-33, -25); ctx.closePath();
                                                                                                                                                                                ctx.fill();

                                                                                                                                                                                // Main sails
                                                                                                                                                                                ctx.beginPath();
                                                                                                                                                                                ctx.moveTo(0, -65); ctx.quadraticCurveTo(0 + billow, -50, 0, -35);
                                                                                                                                                                                ctx.lineTo(-11, -35); ctx.lineTo(-11, -65); ctx.closePath();
                                                                                                                                                                                ctx.moveTo(0, -35); ctx.quadraticCurveTo(0 + billow + 5, -20, 0, -5);
                                                                                                                                                                                ctx.lineTo(-11, -5); ctx.lineTo(-11, -35); ctx.closePath();
                                                                                                                                                                                ctx.fill();

                                                                                                                                                                                // Front (Foremast) sails
                                                                                                                                                                                ctx.beginPath();
                                                                                                                                                                                ctx.moveTo(25, -45); ctx.quadraticCurveTo(25 + billow * 0.8, -30, 25, -15);
                                                                                                                                                                                ctx.lineTo(17, -15); ctx.lineTo(17, -45); ctx.closePath();
                                                                                                                                                                                ctx.moveTo(25, -15); ctx.quadraticCurveTo(25 + billow * 0.8, -5, 25, 0);
                                                                                                                                                                                ctx.lineTo(17, 0); ctx.lineTo(17, -15); ctx.closePath();
                                                                                                                                                                                ctx.fill();

                                                                                                                                                                                // Sail seams and wear (cloth panel lines)
                                                                                                                                                                                ctx.strokeStyle = isNight ? 'rgba(60, 75, 95, 0.45)' : 'rgba(120, 130, 135, 0.4)';
                                                                                                                                                                                ctx.lineWidth = 0.6;
                                                                                                                                                                                ctx.beginPath();
                                                                                                                                                                                ctx.moveTo(-5, -63); ctx.quadraticCurveTo(-5 + billow * 0.5, -50, -5, -37);
                                                                                                                                                                                ctx.moveTo(-5, -33); ctx.quadraticCurveTo(-5 + billow * 0.6, -20, -5, -7);
                                                                                                                                                                                ctx.moveTo(21, -43); ctx.quadraticCurveTo(21 + billow * 0.4, -30, 21, -17);
                                                                                                                                                                                ctx.moveTo(-29, -43); ctx.quadraticCurveTo(-29 + backBillow * 0.5, -35, -29, -27);
                                                                                                                                                                                ctx.stroke();

                                                                    // Pirate Flag (Jolly Roger, fluttering in the wind)
                                                                                                                                        const flutter = Math.sin(clock * 6) * 2;
                                                                                                                                        ctx.fillStyle = '#050505';
                                                                                                                                        ctx.beginPath();
                                                                                                                                        ctx.moveTo(-25, -55);
                                                                                                                                        ctx.quadraticCurveTo(-31, -55 + flutter, -38, -54 - flutter * 0.5);
                                                                                                                                        ctx.lineTo(-38, -48 + flutter * 0.4);
                                                                                                                                        ctx.quadraticCurveTo(-31, -49 - flutter, -25, -49);
                                                                                                                                        ctx.closePath();
                                                                                                                                        ctx.fill();
                                                                                                                                        ctx.fillStyle = 'rgba(235, 235, 225, 0.85)';
                                                                                                                                        ctx.beginPath();
                                                                                                                                        ctx.arc(-31, -51.5 + flutter * 0.2, 1.4, 0, Math.PI * 2);
                                                                                                                                        ctx.fill();

                                                                    ctx.restore();

                                                                    // 3. Primary Ocean Water Body (Front layer)
                                                                    ctx.beginPath();
                                                                    ctx.moveTo(0, W_HEIGHT);
                                                                    ctx.lineTo(0, nodes[0].y);

                                                                    // Bezier curve through nodes for liquid smoothness
                                                                    for (let i = 0; i < NODE_COUNT - 1; i++) {
                                                                        const cx = (i * dx + (i + 1) * dx) / 2;
                                                                        const cy = (nodes[i].y + nodes[i + 1].y) / 2;
                                                                        ctx.quadraticCurveTo(i * dx, nodes[i].y, cx, cy);
                                                                    }
                                                                    ctx.lineTo(W_WIDTH, nodes[NODE_COUNT - 1].y);
                                                                    ctx.lineTo(W_WIDTH, W_HEIGHT);
                                                                    ctx.closePath();

                                                                    const oceanGrad = ctx.createLinearGradient(0, W_HEIGHT * 0.3, 0, W_HEIGHT);
                                                                                                                                        if (isNight) {
                                                                                                                                            oceanGrad.addColorStop(0, 'rgba(22, 66, 108, 0.9)');
                                                                                                                                            oceanGrad.addColorStop(0.35, 'rgba(12, 42, 76, 0.94)');
                                                                                                                                            oceanGrad.addColorStop(1, 'rgba(2, 10, 24, 0.99)');
                                                                                                                                        } else {
                                                                                                                                            oceanGrad.addColorStop(0, 'rgba(24, 170, 195, 0.82)');
                                                                                                                                            oceanGrad.addColorStop(0.35, 'rgba(6, 110, 150, 0.9)');
                                                                                                                                            oceanGrad.addColorStop(1, 'rgba(0, 30, 68, 0.97)');
                                                                                                                                        }
                                                                                                                                        ctx.fillStyle = oceanGrad;
                                                                                                                                        ctx.fill();

                                                                                                                                        // Sub-surface swell bands (moving light/dark undulation for real water depth)
                                                                                                                                                                                                            ctx.save();
                                                                                                                                                                                                            ctx.clip();
                                                                                                                                                                                                            for (let b = 0; b < 8; b++) {
                                                                                                                                                                                                                const by = W_HEIGHT * 0.55 + b * 10;
                                                                                                                                                                                                                ctx.beginPath();
                                                                                                                                                                                                                ctx.moveTo(0, by);
                                                                                                                                                                                                                for (let x = 0; x <= W_WIDTH; x += 6) {
                                                                                                                                                                                                                    ctx.lineTo(x, by + Math.sin(x * 0.03 + clock * (0.8 + b * 0.25) + b * 1.7) * (1.6 + b * 0.45) + Math.sin(x * 0.075 - clock * 1.3 + b * 2.9) * (0.8 + b * 0.15));
                                                                                                                                                                                                                }
                                                                                                                                            ctx.strokeStyle = isNight ? `rgba(120, 175, 230, ${Math.max(0.02, 0.075 - b * 0.008)})` : `rgba(210, 245, 255, ${Math.max(0.04, 0.17 - b * 0.018)})`;
                                                                                                                                                                                                                    ctx.lineWidth = 0.9 + b * 0.25;
                                                                                                                                                                                                                    ctx.stroke();
                                                                                                                                                                                                                }

                                                                                                                                                                                                                // Fine surface ripple texture (short dashes that drift like wind chop)
                                                                                                                                                                                                                for (let r = 0; r < 40; r++) {
                                                                                                                                                                                                                    const rx = ((r * 37.3) + clock * (6 + (r % 5) * 2)) % W_WIDTH;
                                                                                                                                                                                                                    const ri2 = Math.max(0, Math.min(NODE_COUNT - 1, Math.floor(rx / dx)));
                                                                                                                                                                                                                    const rowY = nodes[ri2].y + 5 + ((r * 23) % 85);
                                                                                                                                                                                                                    const fade = 0.5 + 0.5 * Math.sin(clock * 1.7 + r * 1.3);
                                                                                                                                                                                                                    ctx.strokeStyle = isNight ? `rgba(160, 205, 255, ${0.09 * fade})` : `rgba(235, 252, 255, ${0.2 * fade})`;
                                                                                                                                                                                                                    ctx.lineWidth = 0.8;
                                                                                                                                                                                                                    ctx.beginPath();
                                                                                                                                                                                                                    ctx.moveTo(rx, rowY);
                                                                                                                                                                                                                    ctx.lineTo(rx + 5 + (r % 4) * 2, rowY + 0.4);
                                                                                                                                                                                                                    ctx.stroke();
                                                                                                                                                                                                                }

                                                                                                                                        // Specular glints (tiny sparkles on wave facets catching the light)
                                                                                                                                        for (let g = 0; g < 26; g++) {
                                                                                                                                            const gx = ((g * 53.7) + Math.sin(clock * 0.7 + g) * 6) % W_WIDTH;
                                                                                                                                            const gi = Math.max(0, Math.min(NODE_COUNT - 1, Math.floor(gx / dx)));
                                                                                                                                            const gy = nodes[gi].y + 6 + ((g * 17) % 60);
                                                                                                                                            const tw = Math.max(0, Math.sin(clock * 3 + g * 2.1));
                                                                                                                                            if (tw > 0.6) {
                                                                                                                                                ctx.fillStyle = isNight ? `rgba(220, 238, 255, ${(tw - 0.6) * 0.9})` : `rgba(255, 255, 240, ${(tw - 0.6) * 1.1})`;
                                                                                                                                                ctx.fillRect(gx, gy, 1.6, 1);
                                                                                                                                            }
                                                                                                                                        }
                                                                                                                                        ctx.restore();

                                                                                                                                        // Depth vignette so the water darkens toward the bottom edge
                                                                                                                                        const depthShade = ctx.createLinearGradient(0, W_HEIGHT * 0.7, 0, W_HEIGHT);
                                                                                                                                        depthShade.addColorStop(0, 'rgba(0, 0, 0, 0)');
                                                                                                                                        depthShade.addColorStop(1, isNight ? 'rgba(0, 0, 0, 0.35)' : 'rgba(0, 10, 30, 0.3)');
                                                                                                                                        ctx.fillStyle = depthShade;
                                                                                                                                        ctx.fillRect(0, W_HEIGHT * 0.7, W_WIDTH, W_HEIGHT * 0.3);

                                                                    // Celestial light reflection column (broken glitter path on the water)
                                                                                                                                        const reflPrefix = isNight ? 'rgba(210, 235, 255, ' : 'rgba(255, 240, 180, ';
                                                                                                                                        for (let j = 0; j < 9; j++) {
                                                                                                                                            const ri = Math.max(0, Math.min(NODE_COUNT - 1, Math.floor(celestialX / dx)));
                                                                                                                                            const ry = Math.max(nodes[ri].y + 4, (W_HEIGHT * 0.56)) + j * 9;
                                                                                                                                            if (ry > W_HEIGHT) break;
                                                                                                                                            const rw = 18 - j * 1.6;
                                                                                                                                            const jitter = Math.sin(clock * 2.4 + j * 1.9) * (3 + j * 0.8);
                                                                                                                                            const pulse = 0.55 + 0.45 * Math.sin(clock * 3.1 + j * 2.3);
                                                                                                                                            ctx.fillStyle = `${reflPrefix}${Math.max(0, (0.24 - j * 0.024) * pulse)})`;
                                                                                                                                            ctx.beginPath();
                                                                                                                                            ctx.ellipse(celestialX + jitter, ry, Math.max(2, rw), 1.6 + j * 0.12, 0, 0, Math.PI * 2);
                                                                                                                                            ctx.fill();
                                                                                                                                        }

                                                                    // 4. Water Surface line (crisp, no glow halo)
                                                                                                                                                                                                            ctx.strokeStyle = isNight ? 'rgba(190, 225, 255, 0.45)' : 'rgba(255, 255, 255, 0.55)';
                                                                                                                                                                                                            ctx.lineWidth = 1.4;
                                                                                                                                                                                                            ctx.stroke();

                                                                                                                                        // Ambient agitation tint: the whole water body brightens softly with overall wave energy
                                                                                                                                        let waveEnergy = 0;
                                                                                                                                        for (let i = 0; i < NODE_COUNT; i++) waveEnergy += nodes[i].foam;
                                                                                                                                        waveEnergy = Math.min(1, waveEnergy / (NODE_COUNT * 0.35));
                                                                                                                                        if (waveEnergy > 0.02) {
                                                                                                                                            const ambientTint = ctx.createLinearGradient(0, W_HEIGHT * 0.45, 0, W_HEIGHT);
                                                                                                                                            ambientTint.addColorStop(0, isNight ? `rgba(90, 150, 210, ${waveEnergy * 0.1})` : `rgba(200, 245, 255, ${waveEnergy * 0.14})`);
